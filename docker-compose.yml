# LearnFlow — Phase 1 (Local-First). Service: postgres-db + backend-api.
# frontend-app ditambahkan di Milestone 3.
# Pakai:  docker compose up --build
# (docker-compose.override.yml otomatis ikut → hot-reload. Untuk mode "produksi": -f docker-compose.yml)

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: learnflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 saja: DB tidak boleh terbuka ke LAN/Wi-Fi kampus.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override: di dalam network compose, host DB = nama service.
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
