# PHASE 2 — Nginx di level HOST VM (bukan container). Taruh di /etc/nginx/conf.d/learnflow.conf
# Port publik GCP firewall: hanya 22, 80, 443. 8000/8080/5432 TIDAK dibuka.
# SSL: jalankan `sudo certbot --nginx -d <domain>` setelah domain mengarah ke IP VM.

server {
    listen 80;
    server_name _;   # ganti dengan domain setelah ada

    client_max_body_size 1m;

    # Header proxy. X-Forwarded-For SENGAJA di-overwrite ($remote_addr), bukan di-append,
    # supaya klien tidak bisa memalsukan IP dan melewati slowapi.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE stream roadmap: buffering WAJIB mati, timeout panjang (LangGraph 15–30 dtk).
    location ~ ^/api/v1/roadmaps/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }

    # Frontend (container frontend-app, ditambahkan di Milestone 3).
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
